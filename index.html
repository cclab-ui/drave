<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#192720">
<meta name="description" content="모은 위스키와 오늘 마신 위스키를 기록하는 앱">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DRAVÉ">
<title>DRAVÉ — 나의 위스키 기록</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&family=Cormorant+Garamond:ital,wght@0,600;1,500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#192720; --panel:#1f2f27; --panel2:#283a31; --line:#33473c;
  --amber:#c4a77a; --amber2:#e2cba3; --cream:#f3e8d3; --muted:#a89a85; --dim:#82725f;
  --red:#c8644a;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#101a15;color:var(--cream);font-family:'Noto Sans KR',sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit;color:var(--cream)}
.app{max-width:440px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;padding-bottom:96px;box-shadow:0 0 60px #000}
header{padding:calc(22px + env(safe-area-inset-top)) 20px 10px;display:flex;align-items:flex-end;justify-content:space-between}
.logo{font-family:'Noto Sans KR',sans-serif;font-weight:700;font-size:30px;letter-spacing:.02em;color:var(--cream);line-height:1.1}
.logo small{display:block;font-family:'Noto Sans KR';font-size:11px;letter-spacing:.05em;color:var(--muted);margin-top:4px}
.date{font-size:12px;color:var(--muted);text-align:right}
h2{font-family:'Gowun Batang',serif;font-size:19px;font-weight:700;margin:22px 20px 12px;display:flex;justify-content:space-between;align-items:center}
h2 .link{font-family:'Noto Sans KR';font-size:12px;color:var(--amber);font-weight:500}
.view{display:none}.view.on{display:block;animation:fade .25s}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1}}

/* hero */
.hero{margin:6px 16px 0;border-radius:22px;padding:22px;background:radial-gradient(120% 120% at 100% 0%,#4d4a36 0%,#24372d 50%,#1c2b24 100%);border:1px solid #3c5245;position:relative;overflow:hidden}
.hero .k{font-size:12px;color:var(--amber2);letter-spacing:.08em}
.hero .t{font-family:'Gowun Batang',serif;font-size:22px;line-height:1.4;margin:6px 0 16px}
.hero .t b{color:var(--amber2)}
.hero .glass{position:absolute;right:-6px;bottom:-8px;width:120px;opacity:.9}
.btn{display:inline-flex;align-items:center;gap:6px;background:var(--amber);color:#192720;font-weight:700;padding:11px 18px;border-radius:999px;font-size:14px}
.btn.ghost{background:transparent;color:var(--amber2);border:1px solid var(--amber)}
.btn.full{width:100%;justify-content:center;padding:14px}

/* cards */
.list{padding:0 16px;display:flex;flex-direction:column;gap:10px}
.pour{display:flex;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;align-items:center}
.pour .ic{width:44px;height:44px;border-radius:12px;background:var(--panel2);display:grid;place-items:center;flex:none}
.pour .nm{font-weight:700;font-size:15px}
.pour .mt{font-size:12px;color:var(--muted);margin-top:2px}
.pour .tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.tag{font-size:11px;padding:3px 8px;border-radius:999px;background:#2e4035;color:var(--amber2)}
.stars{color:var(--amber);font-size:13px;letter-spacing:1px;margin-left:auto;flex:none;align-self:flex-start}
.empty{color:var(--dim);font-size:13px;text-align:center;padding:26px;border:1px dashed var(--line);border-radius:16px;margin:0 16px}

/* shelf */
.filters{display:flex;gap:6px;padding:0 16px 12px;overflow-x:auto}
.chip{flex:none;font-size:13px;padding:7px 13px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.chip.on{background:var(--amber);border-color:var(--amber);color:#192720;font-weight:700}
.shelf{margin:0 16px;padding:18px 10px 0;border-radius:18px;background:linear-gradient(#1f3028,#16231d)}
.row{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding-bottom:6px;border-bottom:8px solid #82725f;margin-bottom:18px;box-shadow:0 10px 12px -10px #000}
.bt{display:flex;flex-direction:column;align-items:center;gap:6px;padding:4px 0}
.bt svg{height:96px;transition:transform .2s}
.bt:hover svg{transform:translateY(-4px)}
.bt span{font-size:11px;color:var(--muted);text-align:center;line-height:1.25;height:28px;overflow:hidden}

/* stats */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 16px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px}
.stat .n{font-family:'Cormorant Garamond',serif;font-size:36px;color:var(--amber2);line-height:1}
.stat .l{font-size:12px;color:var(--muted);margin-top:6px}
.bar{display:flex;align-items:center;gap:10px;font-size:13px;margin-bottom:10px}
.bar .tr{flex:1;height:8px;background:var(--panel2);border-radius:9px;overflow:hidden}
.bar .tr i{display:block;height:100%;background:linear-gradient(90deg,var(--amber),var(--amber2));border-radius:9px}
.bar .lb{width:64px;color:var(--muted)}
.box{margin:0 16px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:12px}
.cal .w{color:var(--dim);padding-bottom:4px}
.cal .d{aspect-ratio:1;border-radius:10px;display:grid;place-items:center;color:var(--muted);position:relative}
.cal .d.has{background:#33473c;color:var(--amber2);font-weight:700}
.cal .d.has.l2{background:#82725f;color:var(--cream)}.cal .d.has.l3{background:var(--amber);color:#192720}
.cal .d.today{outline:1px solid var(--amber2)}
.calhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-family:'Gowun Batang';font-size:16px}
.calhead button{width:30px;height:30px;border-radius:50%;background:var(--panel2)}

/* nav */
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:440px;background:rgba(25,39,32,.94);backdrop-filter:blur(12px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:8px 6px calc(10px + env(safe-area-inset-bottom));z-index:5}
nav button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--dim)}
nav button.on{color:var(--amber2)}
.seg{display:flex;margin:6px 16px 0;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px}
.seg button{flex:1;padding:9px;border-radius:999px;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--amber);color:#192720;font-weight:700}
.spend-hero{margin:0 16px;border-radius:20px;padding:20px;background:radial-gradient(120% 120% at 100% 0%,#4d4a36 0%,#24372d 55%,#1c2b24 100%);border:1px solid #3c5245}
.spend-hero .l{font-size:12px;color:var(--amber2)}
.spend-hero .big{font-size:32px;font-weight:700;margin:4px 0 14px;letter-spacing:-.01em}
.spend-hero .big small{font-size:16px;font-weight:500;margin-left:2px}
.spend-hero .sub{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;border-top:1px solid #ffffff1a;padding-top:12px}
.spend-hero .sub b{display:block;font-size:15px}.spend-hero .sub span{font-size:11px;color:var(--muted)}
.months{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;align-items:end;height:130px}
.months .m{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;font-size:10px;color:var(--dim)}
.months .m i{display:block;width:100%;max-width:18px;border-radius:5px 5px 2px 2px;background:var(--panel2);min-height:3px}
.months .m.has i{background:linear-gradient(var(--amber2),var(--amber))}
.months .m.cur span{color:var(--cream);font-weight:700}
.months .m em{font-style:normal;font-size:9px;color:var(--amber2);height:11px;white-space:nowrap}
nav svg{width:22px;height:22px}
nav .add{margin-top:-24px}
nav .add div{width:54px;height:54px;border-radius:50%;background:var(--amber);display:grid;place-items:center;box-shadow:0 6px 20px #c4a77a44;color:#192720}

/* sheet */
.dim{position:fixed;inset:0;background:#000a;display:none;z-index:9;align-items:flex-end;justify-content:center}
.dim.on{display:flex}
.sheet{width:100%;max-width:440px;max-height:90vh;overflow:auto;background:var(--panel);border-radius:24px 24px 0 0;padding:10px 20px 28px;animation:up .25s}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.grab{width:40px;height:4px;border-radius:4px;background:var(--line);margin:0 auto 14px}
.sheet h3{font-family:'Gowun Batang';font-size:20px;margin-bottom:16px}
.f{margin-bottom:14px}
.f label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}
.f input,.f select,.f textarea{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px;outline:none}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--amber)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opts .chip{cursor:pointer}
.rate{display:flex;gap:6px;font-size:28px}
.rate button{color:var(--line)}.rate button.on{color:var(--amber)}
input[type=range]{accent-color:var(--amber);padding:0!important;background:none!important;border:0!important}
.detail-top{display:flex;gap:16px;align-items:center;margin-bottom:16px}
.detail-top svg{height:130px;flex:none}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px}
.kv dt{color:var(--muted)}
.rowbtn{display:flex;gap:8px;margin-top:16px}
.rowbtn .btn{flex:1;justify-content:center}
.del{color:var(--red);font-size:13px;margin-top:14px;width:100%;text-align:center}
.preview{display:flex;gap:16px;align-items:center;background:radial-gradient(circle at 30% 40%,#2f4438,#1f2f27 70%);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:16px}
.preview #pv{flex:none;width:76px;display:grid;place-items:center}
.pvside{flex:1}.pvside label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}
.pvside .chip{font-size:12px;padding:5px 10px}
.sw{display:flex;gap:8px}.sw button{width:26px;height:26px;border-radius:50%;border:2px solid var(--line)}.sw button.on{border-color:var(--amber2);transform:scale(1.12)}
.ac{display:none;position:absolute;left:0;right:0;top:100%;margin-top:4px;background:var(--panel2);border:1px solid var(--amber);border-radius:12px;overflow:hidden;z-index:3;box-shadow:0 10px 24px #000a}
.ac button{display:block;width:100%;text-align:left;padding:10px 12px;border-bottom:1px solid var(--line)}
.ac button:last-child{border:0}.ac button:hover{background:#33473c}
.ac b{display:block;font-size:14px}.ac span{font-size:11px;color:var(--muted)}
.install{margin:6px 16px 0;display:none;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.install.on{display:flex}
.install img{width:40px;height:40px;border-radius:10px}
.install .tx{flex:1;font-size:13px;line-height:1.4}.install .tx b{display:block;font-size:14px}
.install .x{color:var(--dim);font-size:18px;padding:4px}
.ios-step{display:flex;gap:12px;align-items:center;background:var(--panel2);border-radius:12px;padding:12px;margin-bottom:8px;font-size:14px}
.ios-step i{flex:none;width:26px;height:26px;border-radius:50%;background:var(--amber);color:#192720;font-style:normal;font-weight:700;display:grid;place-items:center}
.avatar{width:44px;height:44px;border-radius:50%;background:var(--amber);color:#192720;display:grid;place-items:center;font-weight:700;font-size:18px;flex:none}
.authwrap{position:fixed;inset:0;z-index:15;background:var(--bg);display:none;overflow:auto}
.authwrap.on{display:block}
.auth-in{max-width:400px;margin:0 auto;padding:calc(48px + env(safe-area-inset-top)) 24px 40px}
.auth-logo{width:72px;height:72px;border-radius:18px;display:block;margin:0 auto 14px}
.auth-sub{text-align:center;color:var(--muted);font-size:14px;margin:8px 0 26px}
.chk{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted);margin-bottom:10px}
.chk input{accent-color:var(--amber);width:16px;height:16px}.chk a{color:var(--amber2)}
.auth-msg{background:var(--panel2);border-radius:12px;padding:12px;font-size:13px;color:var(--amber2);margin:6px 0}
.auth-link{display:block;margin:14px auto 0;font-size:13px;color:var(--muted);text-decoration:underline}
.auth-foot{text-align:center;font-size:11px;color:var(--dim);margin-top:30px}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--amber2);color:#192720;padding:10px 18px;border-radius:999px;font-size:13px;font-weight:700;opacity:0;transition:.3s;pointer-events:none;z-index:20}
.toast.on{opacity:1}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo">DRAVÉ<small>나의 위스키 기록장</small></div>
    <div class="date" id="today"></div>
  </header>

  <!-- 홈 -->
  <section class="view on" id="v-home">
    <div class="install" id="installBar"><img src="icons/icon-192.png" alt=""><div class="tx"><b>DRAVÉ 앱 설치하기</b>홈 화면에 추가하면 앱처럼 쓸 수 있어요</div><button class="btn" style="padding:8px 14px;font-size:13px" onclick="doInstall()">설치</button><button class="x" onclick="hideInstall()" aria-label="닫기">×</button></div>
    <div class="hero">
      <div class="k">TONIGHT'S POUR</div>
      <div class="t" id="heroText"></div>
      <button class="btn" onclick="openPour()">+ 오늘의 한 잔 기록</button>
      <svg class="glass" viewBox="0 0 120 120"><path d="M28 30h64l-6 70a8 8 0 0 1-8 7H42a8 8 0 0 1-8-7z" fill="#ffffff10" stroke="#e2cba366" stroke-width="2"/><path d="M33 68h54l-3 32a6 6 0 0 1-6 5H42a6 6 0 0 1-6-5z" fill="#c4a77a" opacity=".9"/><rect x="46" y="52" width="18" height="18" rx="3" fill="#ffffff30" transform="rotate(-12 55 61)"/></svg>
    </div>
    <h2>오늘 마신 위스키 <span class="link" id="todayCount"></span></h2>
    <div class="list" id="todayList"></div>
    <h2>오늘 밤엔 이 병 어때요? <span class="link" onclick="go('shelf')">컬렉션 →</span></h2>
    <div class="list" id="suggest"></div>
    <h2>최근 기록 <span class="link" onclick="go('log')">전체 →</span></h2>
    <div class="list" id="recent"></div>
  </section>

  <!-- 컬렉션 -->
  <section class="view" id="v-shelf">
    <h2>나의 위스키 장 <button class="btn ghost" style="padding:7px 14px;font-size:12px" onclick="openBottle()">+ 병 추가</button></h2>
    <div class="filters" id="filters"></div>
    <div class="shelf" id="shelf"></div>
  </section>

  <!-- 기록 -->
  <section class="view" id="v-log">
    <h2>마신 기록</h2>
    <div class="box" style="margin-bottom:6px">
      <div class="calhead"><button onclick="moveMonth(-1)">‹</button><span id="calTitle"></span><button onclick="moveMonth(1)">›</button></div>
      <div class="cal" id="cal"></div>
    </div>
    <h2 id="logTitle" style="font-size:16px"></h2>
    <div class="list" id="logList"></div>
  </section>

  <!-- 통계 -->
  <section class="view" id="v-stats">
    <div class="seg"><button class="on" onclick="seg(0)">취향</button><button onclick="seg(1)">지출</button></div>
    <div id="rp-taste">
    <h2>나의 취향 리포트</h2>
    <div class="grid" id="statGrid"></div>
    <h2 style="font-size:16px">자주 느낀 맛</h2>
    <div class="box" id="flavorBars"></div>
    <h2 style="font-size:16px">즐겨 마시는 방식</h2>
    <div class="box" id="styleBars"></div>
    </div>
    <div id="rp-spend" style="display:none">
      <h2>컬렉션 지출 내역</h2>
      <div class="spend-hero" id="spendHero"></div>
      <h2 style="font-size:16px">월별 지출 <span class="link" id="yearSel"></span></h2>
      <div class="box"><div class="months" id="months"></div></div>
      <h2 style="font-size:16px">종류별 지출</h2>
      <div class="box" id="typeSpend"></div>
      <h2 style="font-size:16px">구매 내역</h2>
      <div class="list" id="buyList"></div>
      <p style="font-size:11px;color:var(--dim);text-align:center;margin:18px 16px 0">구매가를 적은 병만 계산돼요 · 병 정보에서 언제든 수정할 수 있어요</p>
    </div>
    <h2 style="font-size:16px;margin-top:30px">내 계정</h2><div id="acct"></div>
    <button class="del" style="margin-top:20px;color:var(--dim)" onclick="sheet('<h3>모든 기록을 지울까요?</h3><p style=&quot;color:var(--muted);font-size:14px;margin-bottom:18px&quot;>모은 병과 마신 기록이 모두 사라지고 되돌릴 수 없어요.</p><div class=&quot;rowbtn&quot;><button class=&quot;btn ghost&quot; onclick=&quot;closeSheet()&quot;>취소</button><button class=&quot;btn&quot; style=&quot;background:var(--red);color:var(--cream)&quot; onclick=&quot;clearAll()&quot;>모두 지우기</button></div>')">모든 기록 지우기</button>
  </section>
</div>

<div class="authwrap" id="auth"></div>
<nav>
  <button class="on" data-v="home" onclick="go('home')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>홈</button>
  <button data-v="shelf" onclick="go('shelf')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 2h6v4l2 3v12a1 1 0 0 1-1 1H8a1 1 0 0 1-1-1V9l2-3z"/><path d="M7 13h10"/></svg>컬렉션</button>
  <button class="add" onclick="openPour()"><div><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 5v14M5 12h14"/></svg></div></button>
  <button data-v="log" onclick="go('log')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>기록</button>
  <button data-v="stats" onclick="go('stats')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>리포트</button>
</nav>

<div class="dim" id="dim" onclick="if(event.target===this)closeSheet()"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
const KEY='dram-v1';

  <linearGradient id="${gid}l" x1="0" x2="1"><stop offset="0" stop-color="#000" stop-opacity=".25"/><stop offset=".35" stop-color="#fff" stop-opacity=".18"/><stop offset="1" stop-color="#000" stop-opacity=".35"/></linearGradient></defs>
  <g clip-path="url(#${gid})"><rect width="60" height="150" fill="#ffffff0d"/><rect y="${top}" width="60" height="150" fill="${liquid(b)}"/><rect width="60" height="150" fill="url(#${gid}l)"/></g>
  <path d="${s.p}" fill="none" stroke="#e2cba380" stroke-width="1.4"/>
  <g fill="#82725f">${s.cap}</g>
  ${b.status==='미개봉'?`<g fill="#c8644a">${s.cap}</g>`:''}
  <rect x="${lx}" y="${ly}" width="${lw}" height="${lh}" rx="2" fill="${lf}"/>
  <rect x="${lx+2}" y="${ly+2}" width="${lw-4}" height="${lh-4}" rx="1" fill="none" stroke="${lt}" stroke-opacity=".5" stroke-width=".6"/>
  <text x="${cx}" y="${ly+lh*.45}" text-anchor="middle" font-size="${lw<30?4.6:5.6}" font-weight="700" fill="${lt}" font-family="'Gowun Batang',serif">${nm}</text>
  <text x="${cx}" y="${ly+lh*.72}" text-anchor="middle" font-size="4.4" fill="${lt}" fill-opacity=".8" font-family="'Cormorant Garamond',serif">${b.age?b.age+' YEARS':(b.type||'').toUpperCase()}</text></svg>`;
}
const glassIc=s=>`<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#e2cba3" stroke-width="1.6">${s==='하이볼'?'<path d="M7 3h10l-1 18H8z"/><path d="M7.5 10h9"/>':'<path d="M5 6h14l-1.5 13a2 2 0 0 1-2 2h-7a2 2 0 0 1-2-2z"/><path d="M6 13h12"/>'}</svg>`;
function pourCard(p,click=true){
  return `<div class="pour" ${click?`onclick="openPourDetail('${p.id}')"`:''}><div class="ic">${glassIc(p.style)}</div>
  <div style="flex:1;min-width:0"><div class="nm">${p.name}</div><div class="mt">${fmtDate(p.date)} · ${p.style}${p.place?' · '+p.place:''}</div>
  ${p.flavors.length?`<div class="tags">${p.flavors.map(f=>`<span class="tag">${f}</span>`).join('')}</div>`:''}</div>
  <div class="stars">${stars(p.rating)}</div></div>`;
}
function fmtDate(s){const t=todayStr();if(s===t)return '오늘';if(s===d(1))return '어제';const [y,m,dd]=s.split('-');return `${+m}월 ${+dd}일`}

function render(){
  const now=new Date();
  $('today').innerHTML=`${now.getMonth()+1}월 ${now.getDate()}일<br>${'일월화수목금토'[now.getDay()]}요일`;
  const todays=S.pours.filter(p=>p.date===todayStr());
  const who=(typeof NICK!=='undefined'&&NICK)?`${esc(NICK)}님, `:'';
  $('heroText').innerHTML=todays.length?`${who}오늘 <b>${todays.length}잔</b> 마셨어요.<br>천천히 즐겨요 🥃`:`${who}오늘은 어떤 위스키를<br><b>한 잔</b> 해볼까요?`;
  $('todayCount').textContent=todays.length?todays.length+'잔':'';
  $('todayList').innerHTML=todays.length?todays.map(p=>pourCard(p)).join(''):'<div class="empty">아직 오늘 기록이 없어요</div>';
  const open=S.bottles.filter(b=>b.status==='개봉'&&b.left>0);
  const pick=open.sort((a,b)=>{const la=lastPour(a.id),lb=lastPour(b.id);return la.localeCompare(lb)})[0];
  $('suggest').innerHTML=pick?`<div class="pour" onclick="openPour('${pick.id}')"><div class="ic" style="width:50px;height:64px">${bottleSVG(pick,56)}</div><div style="flex:1"><div class="nm">${pick.name}</div><div class="mt">${lastPour(pick.id)?'마지막으로 마신 지 '+daysAgo(lastPour(pick.id))+'일 · ':''}남은 양 ${pick.left}%</div></div><span class="tag">이걸로 기록</span></div>`:'<div class="empty">개봉한 병이 없어요</div>';
  const rec=[...S.pours].filter(p=>p.date!==todayStr()).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,3);
  $('recent').innerHTML=rec.map(p=>pourCard(p)).join('')||'<div class="empty">기록이 없어요</div>';
  renderShelf();renderLog();renderStats();renderSpend();
}
const lastPour=id=>S.pours.filter(p=>p.bottleId===id).map(p=>p.date).sort().pop()||'';
const daysAgo=s=>Math.round((new Date(todayStr())-new Date(s))/864e5);

function renderShelf(){
  const fs=['전체','개봉','미개봉','다 마심',...TYPES.filter(t=>S.bottles.some(b=>b.type===t))];
  $('filters').innerHTML=fs.map(f=>`<button class="chip ${f===shelfFilter?'on':''}" onclick="shelfFilter='${f}';renderShelf()">${f}</button>`).join('');
  let bs=S.bottles.filter(b=>shelfFilter==='전체'||b.status===shelfFilter||b.type===shelfFilter);
  let html='';
  for(let i=0;i<Math.max(bs.length,1);i+=4){
    html+='<div class="row">'+bs.slice(i,i+4).map(b=>`<button class="bt" onclick="openBottleDetail('${b.id}')">${bottleSVG(b)}<span>${b.name}</span></button>`).join('')+'</div>';
  }
  $('shelf').innerHTML=bs.length?html:'<div class="row"><div style="grid-column:1/5;text-align:center;color:var(--dim);font-size:13px;padding:30px 0">'+(S.bottles.length?'비어 있어요':'아직 모은 위스키가 없어요<br><br><button class="btn" onclick="openBottle()">+ 첫 병 추가하기</button><br><br><span class="link" style="color:var(--amber);cursor:pointer" onclick="loadSample()">예시 데이터로 둘러보기</span>')+'</div></div>';
}

function renderLog(){
  const y=calDate.getFullYear(),m=calDate.getMonth();
  $('calTitle').textContent=`${y}년 ${m+1}월`;
  const first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate();
  let h='일월화수목금토'.split('').map(w=>`<div class="w">${w}</div>`).join('');
  for(let i=0;i<first;i++)h+='<div></div>';
  for(let i=1;i<=days;i++){
    const ds=`${y}-${String(m+1).padStart(2,'0')}-${String(i).padStart(2,'0')}`;
    const n=S.pours.filter(p=>p.date===ds).length;
    h+=`<button class="d ${n?'has l'+Math.min(n,3):''} ${ds===todayStr()?'today':''}" onclick="pickDay=pickDay==='${ds}'?null:'${ds}';renderLog()" style="${pickDay===ds?'outline:2px solid var(--cream)':''}">${i}</button>`;
  }
  $('cal').innerHTML=h;
  const mm=`${y}-${String(m+1).padStart(2,'0')}`;
  let ps=S.pours.filter(p=>pickDay?p.date===pickDay:p.date.startsWith(mm)).sort((a,b)=>b.date.localeCompare(a.date));
  $('logTitle').innerHTML=pickDay?`${fmtDate(pickDay)} 기록 <span class="link" onclick="pickDay=null;renderLog()">이번 달 전체</span>`:`이번 달 ${ps.length}잔`;
  $('logList').innerHTML=ps.map(p=>pourCard(p)).join('')||'<div class="empty">기록이 없어요</div>';
}
function moveMonth(n){calDate=new Date(calDate.getFullYear(),calDate.getMonth()+n,1);pickDay=null;renderLog()}

function renderStats(){
  const mm=todayStr().slice(0,7);
  const thisMonth=S.pours.filter(p=>p.date.startsWith(mm)).length;
  const cnt={};S.pours.forEach(p=>cnt[p.name]=(cnt[p.name]||0)+1);
  const fav=Object.entries(cnt).sort((a,b)=>b[1]-a[1])[0];
  const avg=S.pours.length?(S.pours.reduce((s,p)=>s+p.rating,0)/S.pours.length).toFixed(1):'-';
  $('statGrid').innerHTML=`
   <div class="stat"><div class="n">${S.bottles.length}</div><div class="l">모은 병</div></div>
   <div class="stat"><div class="n">${thisMonth}</div><div class="l">이번 달 마신 잔</div></div>
   <div class="stat"><div class="n">${avg}</div><div class="l">평균 별점</div></div>
   <div class="stat"><div class="n" style="font-family:'Gowun Batang';font-size:17px;line-height:1.3">${fav?fav[0]:'-'}</div><div class="l">가장 많이 마신 위스키</div></div>`;
  const bars=(obj)=>{const e=Object.entries(obj).sort((a,b)=>b[1]-a[1]).slice(0,6);const mx=e[0]?e[0][1]:1;return e.map(([k,v])=>`<div class="bar"><span class="lb">${k}</span><div class="tr"><i style="width:${v/mx*100}%"></i></div><span>${v}</span></div>`).join('')||'<div style="color:var(--dim);font-size:13px">기록이 쌓이면 보여요</div>'};
  const fl={},st={};S.pours.forEach(p=>{p.flavors.forEach(f=>fl[f]=(fl[f]||0)+1);st[p.style]=(st[p.style]||0)+1});
  $('flavorBars').innerHTML=bars(fl);$('styleBars').innerHTML=bars(st);
}

let spendYear=new Date().getFullYear();
function seg(i){document.querySelectorAll('.seg button').forEach((b,j)=>b.classList.toggle('on',i===j));$('rp-taste').style.display=i?'none':'block';$('rp-spend').style.display=i?'block':'none'}
const won=n=>Math.round(n).toLocaleString()+'원';
const man=n=>n>=10000?(n/10000).toFixed(n%10000?1:0).replace(/\.0$/,'')+'만':n?Math.round(n/1000)+'천':'';
function renderSpend(){
  const bs=S.bottles.filter(b=>+b.price>0);
  const total=bs.reduce((s,b)=>s+ +b.price,0);
  const ty=String(new Date().getFullYear()), tm=todayStr().slice(0,7);
  const yearSum=bs.filter(b=>(b.bought||'').startsWith(ty)).reduce((s,b)=>s+ +b.price,0);
  const monSum=bs.filter(b=>(b.bought||'').startsWith(tm)).reduce((s,b)=>s+ +b.price,0);
  const top=[...bs].sort((a,b)=>b.price-a.price)[0];
  $('spendHero').innerHTML=`<div class="l">위스키 수집에 쓴 총 금액</div><div class="big">${total.toLocaleString()}<small>원</small></div>
   <div class="sub"><div><b>${bs.length}병</b><span>구매가 기록</span></div><div><b>${bs.length?won(total/bs.length):'-'}</b><span>병당 평균</span></div><div><b>${won(monSum)}</b><span>이번 달</span></div></div>
   ${top?`<div style="font-size:12px;color:var(--muted);margin-top:12px">가장 비싼 병 · <span style="color:var(--cream)">${top.name}</span> ${won(+top.price)} &nbsp;|&nbsp; 올해 ${won(yearSum)}</div>`:''}`;
  const years=[...new Set(bs.map(b=>(b.bought||'').slice(0,4)).filter(Boolean).concat(ty))].sort();
  $('yearSel').innerHTML=years.map(y=>`<span onclick="spendYear=${y};renderSpend()" style="margin-left:8px;cursor:pointer;${+y===spendYear?'color:var(--cream);font-weight:700':'color:var(--dim)'}">${y}</span>`).join('');
  const ms=Array.from({length:12},(_,i)=>{const k=spendYear+'-'+String(i+1).padStart(2,'0');return bs.filter(b=>(b.bought||'').startsWith(k)).reduce((s,b)=>s+ +b.price,0)});
  const mx=Math.max(...ms,1);
  $('months').innerHTML=ms.map((v,i)=>`<div class="m ${v?'has':''} ${spendYear+'-'+String(i+1).padStart(2,'0')===tm?'cur':''}"><em>${man(v)}</em><i style="height:${v?Math.max(6,v/mx*90):3}px"></i><span>${i+1}</span></div>`).join('');
  const bt={};bs.forEach(b=>bt[b.type]=(bt[b.type]||0)+ +b.price);
  const e=Object.entries(bt).sort((a,b)=>b[1]-a[1]),m2=e[0]?e[0][1]:1;
  $('typeSpend').innerHTML=e.map(([k,v])=>`<div class="bar"><span class="lb">${k}</span><div class="tr"><i style="width:${v/m2*100}%"></i></div><span style="min-width:74px;text-align:right">${won(v)}</span></div>`).join('')||'<div style="color:var(--dim);font-size:13px">병을 추가할 때 구매가를 적으면 보여요</div>';
  const list=[...bs].sort((a,b)=>(b.bought||'').localeCompare(a.bought||''));
  $('buyList').innerHTML=list.map(b=>`<div class="pour" onclick="openBottleDetail('${b.id}')"><div class="ic" style="width:40px;height:56px">${bottleSVG(b,50)}</div><div style="flex:1;min-width:0"><div class="nm">${b.name}</div><div class="mt">${b.bought?b.bought.replace(/-/g,'.'):'구매일 미입력'}${b.shop?' · '+b.shop:''}</div></div><div style="font-weight:700;color:var(--amber2)">${won(+b.price)}</div></div>`).join('')||'<div class="empty" style="margin:0">아직 구매 기록이 없어요</div>';
}
function go(v){
  document.querySelectorAll('.view').forEach(e=>e.classList.toggle('on',e.id==='v-'+v));
  document.querySelectorAll('nav button[data-v]').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
  window.scrollTo(0,0);
}
function sheet(html){$('sheet').innerHTML='<div class="grab"></div>'+html;$('dim').classList.add('on')}
function closeSheet(){$('dim').classList.remove('on')}
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),1600)}
const chips=(name,arr,sel,multi)=>`<div class="opts" data-name="${name}">${arr.map(a=>`<span class="chip ${(multi?sel.includes(a):sel===a)?'on':''}" onclick="${multi?'this.classList.toggle(\'on\')':`[...this.parentNode.children].forEach(c=>c.classList.remove('on'));this.classList.add('on')`}">${a}</span>`).join('')}</div>`;
const picked=(name)=>[...document.querySelectorAll(`[data-name="${name}"] .chip.on`)].map(c=>c.textContent);

let rateVal=4;
function openPour(bid,pid){
  const p=pid?S.pours.find(x=>x.id===pid):null;
  rateVal=p?p.rating:4;
  const sel=p?p.bottleId:(bid||'');
  sheet(`<h3>${p?'기록 수정':'오늘의 한 잔'}</h3>
  <div class="f"><label>어떤 위스키?</label><select id="pBottle" onchange="$('pNameWrap').style.display=this.value?'none':'block'">
    <option value="">직접 입력 (바·친구집 등)</option>${S.bottles.filter(b=>b.status!=='다 마심'||b.id===sel).map(b=>`<option value="${b.id}" ${b.id===sel?'selected':''}>${b.name}</option>`).join('')}</select></div>
  <div class="f" id="pNameWrap" style="display:${sel?'none':'block'}"><label>위스키 이름</label><input id="pName" placeholder="예) 발베니 12년 더블우드" value="${p&&!p.bottleId?p.name:''}"></div>
  <div class="two"><div class="f"><label>날짜</label><input type="date" id="pDate" value="${p?p.date:todayStr()}"></div>

  <div class="f"><label>마신 방식</label>${chips('style',STYLES,p?p.style:'니트')}</div>
  <div class="f"><label>느낀 맛 (여러 개)</label>${chips('flv',FLAVORS,p?p.flavors:[],true)}</div>
  <div class="f"><label>별점</label><div class="rate" id="rate"></div></div>
  <div class="f"><label>한 줄 메모</label><textarea id="pMemo" rows="2" placeholder="오늘의 느낌을 남겨요">${p?p.memo:''}</textarea></div>
  ${!p?`<div class="f" id="sipWrap"><label>병에서 줄일 양: <b id="sipV">5</b>%</label><input type="range" id="sip" min="0" max="20" value="5" oninput="$('sipV').textContent=this.value"></div>`:''}
  <button class="btn full" onclick="savePour('${pid||''}')">${p?'수정 완료':'기록하기'}</button>
  ${p?`<button class="del" onclick="delPour('${pid}')">이 기록 삭제</button>`:''}`);
  drawRate();
}
function drawRate(){$('rate').innerHTML=[1,2,3,4,5].map(i=>`<button class="${i<=rateVal?'on':''}" onclick="rateVal=${i};drawRate()">★</button>`).join('')}
function savePour(pid){
  const bid=$('pBottle').value, b=S.bottles.find(x=>x.id===bid);
  const name=b?b.name:$('pName').value.trim();
  if(!name){toast('위스키 이름을 적어주세요');return}
  const data={bottleId:bid,name,date:$('pDate').value||todayStr(),place:$('pPlace').value.trim(),style:picked('style')[0]||'니트',flavors:picked('flv'),rating:rateVal,memo:$('pMemo').value.trim()};
  let rec;
  if(pid){rec=Object.assign(S.pours.find(x=>x.id===pid),data)}
  else{rec={id:uid(),...data};S.pours.push(rec);
    if(b){b.left=Math.max(0,b.left-(+$('sip').value));if(b.status==='미개봉')b.status='개봉';if(b.left===0)b.status='다 마심'}}
  save();closeSheet();render();
  cloud.upsertMany(!pid&&b?[b]:[],[rec]).then(ok=>ok&&toast(pid?'수정했어요':'한 잔 기록 완료 🥃'));
}
function delPour(id){S.pours=S.pours.filter(p=>p.id!==id);save();closeSheet();render();cloud.del('pours',id).then(ok=>ok&&toast('삭제했어요'))}
function openPourDetail(id){
  const p=S.pours.find(x=>x.id===id);
  sheet(`<h3>${p.name}</h3><div style="margin-bottom:12px">${stars(p.rating)}</div>
  <dl class="kv"><dt>날짜</dt><dd>${fmtDate(p.date)} (${p.date})</dd><dt>방식</dt><dd>${p.style}</dd>${p.place?`<dt>장소</dt><dd>${p.place}</dd>`:''}</dl>
  ${p.flavors.length?`<div class="tags" style="display:flex;gap:6px;flex-wrap:wrap;margin:14px 0">${p.flavors.map(f=>`<span class="tag">${f}</span>`).join('')}</div>`:''}
  ${p.memo?`<p style="background:var(--panel2);padding:14px;border-radius:12px;font-family:'Gowun Batang';line-height:1.6">“${p.memo}”</p>`:''}
  <div class="rowbtn"><button class="btn ghost" onclick="openPour(null,'${id}')">수정</button><button class="btn" onclick="closeSheet()">닫기</button></div>`);
}

  sb.auth.onAuthStateChange((ev,session)=>{
    if(session?.user){if(CUR_USER!==session.user.id)onLogin(session.user)}
    else{CUR_USER=null;authScreen()}
  });
}

/* ── 홈 화면 설치 (PWA) ── */
let deferredPrompt=null;
const isStandalone=()=>window.matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const installHidden=()=>{try{return localStorage.getItem('drave-install-hide')==='1'}catch(e){return false}};
function showInstall(){if(!isStandalone()&&!installHidden())$('installBar').classList.add('on')}
function hideInstall(){$('installBar').classList.remove('on');try{localStorage.setItem('drave-install-hide','1')}catch(e){}}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;showInstall()});
window.addEventListener('appinstalled',()=>{$('installBar').classList.remove('on');toast('DRAVÉ가 설치됐어요 🥃')});
if(isIOS)showInstall();
async function doInstall(){
  if(deferredPrompt){deferredPrompt.prompt();const r=await deferredPrompt.userChoice;deferredPrompt=null;if(r.outcome==='accepted')$('installBar').classList.remove('on');return}
  sheet(`<h3>홈 화면에 추가하기</h3>
   ${isIOS?`<div class="ios-step"><i>1</i><span>사파리 아래쪽의 <b>공유 버튼</b>(네모에 위쪽 화살표)을 눌러요</span></div>
   <div class="ios-step"><i>2</i><span>목록을 내려서 <b>홈 화면에 추가</b>를 눌러요</span></div>
   <div class="ios-step"><i>3</i><span>오른쪽 위 <b>추가</b>를 누르면 DRAVÉ 아이콘이 생겨요</span></div>
   <p style="font-size:12px;color:var(--muted);margin:10px 0 16px">카카오톡·인스타 안에서 열었다면, 먼저 사파리로 열어 주세요.</p>`
   :`<div class="ios-step"><i>1</i><span>브라우저 오른쪽 위 <b>메뉴(⋮)</b>를 눌러요</span></div>
   <div class="ios-step"><i>2</i><span><b>앱 설치</b> 또는 <b>홈 화면에 추가</b>를 눌러요</span></div>
   <p style="font-size:12px;color:var(--muted);margin:10px 0 16px">카카오톡·인스타 안에서 열었다면, 먼저 크롬으로 열어 주세요.</p>`}
   <button class="btn full" onclick="closeSheet()">알겠어요</button>`);
}
if('serviceWorker' in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('sw.js').catch(()=>{})}
</script>
